<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Horizontale</title>
  <style>
    /* Réinitialisation de base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Le conteneur principal qui gère le scroll horizontal */
    .slider-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      
      /* Active le magnétisme du scroll (Scroll Snapping) */
      scroll-snap-type: x mandatory;
    }

    /* Masquer les barres de défilement pour un effet plus propre */
    .slider-container::-webkit-scrollbar {
      display: none;
    }
    .slider-container {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Chaque "page" ou section occupe 100% de l'écran */
    .page {
      flex: 0 0 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      font-size: 2rem;
      position: relative;
      
      /* Force l'arrêt du scroll pile sur la section */
      scroll-snap-align: start;
    }

    /* Styles pour différencier vos pages */
    .page-1 {
      background-color: #f1f2f6;
      color: #2f3542;
    }

    .page-2 {
      background-color: #2f3542;
      color: #f1f2f6;
    }

    /* Style du bouton de navigation */
    .btn-nav {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #ff4757;
      color: white;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background-color: #ff6b81;
    }
  </style>
</head>
<body>

  <div class="slider-container" id="mainSlider">
    
    <!-- VOTRE PAGE CLASSIQUE ACTUELLE -->
    <section class="page page-1" id="section1">
      <h1>Votre page classique</h1>
      <p style="font-size: 1.2rem; margin-top: 10px;">Défilez avec votre trackpad/souris ou cliquez ci-dessous</p>
      <button class="btn-nav" onclick="allerVersDroite()">Aller à droite →</button>
    </section>

    <!-- LA DEUXIÈME PAGE ("AUTRE CHOSE") -->
    <section class="page page-2" id="section2">
      <h1>L'autre page / Autre chose</h1>
      <button class="btn-nav" onclick="allerVersGauche()">← Revenir en arrière</button>
    </section>

  </div>

  <script>
    const slider = document.getElementById('mainSlider');
    const section2 = document.getElementById('section2');
    const section1 = document.getElementById('section1');

    // Fonction pour scroller vers la droite (Page 2)
    function allerVersDroite() {
      slider.scrollTo({
        left: section2.offsetLeft,
        behavior: 'smooth'
      });
    }

    // Fonction pour revenir vers la gauche (Page 1)
    function allerVersGauche() {
      slider.scrollTo({
        left: section1.offsetLeft,
        behavior: 'smooth'
      });
    }
  </script>

</body>
</html>
