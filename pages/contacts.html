<!DOCTYPE html>
<html lang="fr">

<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me contacter</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div id="particles-js"></div>

    <!-- Bouton retour mis à jour avec les ID -->
    <a href="../pages/index.html" id="back-btn" class="button2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-corner-down-left btn-icon">
            <path d="M20 4v7a4 4 0 0 1-4 4H4" />
            <path d="m9 10-5 5 5 5" />
        </svg>
        <span id="back-text">Retour à l'index</span>
    </a>

    <main class="contact-container main-content">
        <h1>Me contacter</h1>
        <h2>Vous souhaitez échanger, en savoir plus sur mon parcours ou discuter d'une opportunité ?</h2>
        <p class="contact-subtitle">N'hésitez pas à me contacter via l'un de ces canaux :</p>

        <div class="contact-grid">
            <a href="mailto:ewann89230@gmail.com" class="contact-btn email-btn">
                <img src="../images/email-icon.png" alt="Email" class="contact-icon">
                <span>Email</span>
            </a>

            <div id="phone-container" class="contact-btn phone-btn" onclick="demanderValidationTelephone()"
                style="cursor: pointer;">
                <img src="../images/phone-icon.png" alt="Téléphone" class="contact-icon">
                <span id="phone-text">Afficher le numéro</span>
            </div>

            <a href="https://www.linkedin.com/in/ewann-bertrand-2447333bb/" target="_blank"
                class="contact-btn linkedin-btn">
                <img src="../images/linkedin-icon.png" alt="LinkedIn" class="contact-icon">
                <span>LinkedIn</span>
            </a>

            <a href="https://github.com/VanBert89" target="_blank" class="contact-btn github-btn">
                <img src="../images/github-icon.png" alt="GitHub" class="contact-icon">
                <span>GitHub</span>
            </a>
        </div>
    </main>

    <div class="form-contact">
        <h2>Vous souhaitez me contacter via un formulaire ? </h2>
        <a href="../pages/form-contact.html" class="cta-btn">Cliquez ici</a>
    </div>

    <!-- Script pour gérer dynamiquement le bouton retour -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const from = urlParams.get('from');
            const backBtn = document.getElementById('back-btn');
            const backText = document.getElementById('back-text');

            if (backBtn) {
                if (from === 'parcours') {
                    backBtn.href = 'parcours-évo.html';
                    if (backText) backText.textContent = " Retour au parcours";
                } else {
                    backBtn.href = 'index.html';
                    if (backText) backText.textContent = " Retour à l'index";
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.9.3/tsparticles.bundle.min.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
