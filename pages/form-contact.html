<!DOCTYPE html>
<html lang="fr">

<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de contact</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div id="particles-js"></div>

    <a href="contacts.html" class="button2"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="lucide lucide-corner-down-left btn-icon">
            <path d="M20 4v7a4 4 0 0 1-4 4H4" />
            <path d="m9 10-5 5 5 5" />
        </svg>Retour</a>

    <main class="form-wrapper main-content">
        <h1 class="fade-in-title">Formulaire de contact</h1>
        <p class="fade-in-text">Veuillez renseigner vos informations et votre message.</p>

        <form class="contact-form" action="https://formspree.io/f/mwlpnevw" novalidate>

            <div class="form-group">
                <label for="name">Votre nom</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Votre email</label>
                <input type="email" id="email" name="email" placeholder="format attendu : exemple@exemple.com" required>
            </div>

            <div class="form-group">
                <label for="message">Votre message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                <small id="message-counter" class="message-counter">0 caractères</small>
            </div>

            <button type="submit" class="cta-btn">Envoyer</button>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.9.3/tsparticles.bundle.min.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
